[project]
name = "python-postgresql-crud"
version = "0.1.0"
description = "A simple, robust CRUD application in Python with PostgreSQL, managed by uv."
readme = "README.md"
requires-python = ">=3.13"
license = { text = "MIT" }
authors = [
    { name = "Faiyaz Khan", email = "faiyazkhan024@gmail.com" }
]
keywords = ["python", "postgresql", "crud", "uv", "database"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Topic :: Database",
]
dependencies = [
    "psycopg[binary,pool]>=3.2.0",
    "pydantic>=2.10.0",
    "python-dotenv>=1.0.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.8.0",
]

[project.urls]
Homepage = "https://github.com/faiyazkhan024/python-postgresql-crud"
Repository = "https://github.com/faiyazkhan024/python-postgresql-crud.git"
Issues = "https://github.com/faiyazkhan024/python-postgresql-crud/issues"

[project.scripts]
python-postgresql-crud = "python_postgresql_crud:main"

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 88
target-version = "py313"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "SIM", # flake8-simplify
]
ignore = []

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
python_files = ["test_*.py"]
