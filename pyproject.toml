[project]
name = "python-postgresql-crud"
version = "0.1.0"
description = "A modern, full-stack CRUD application built with Python, FastAPI, and PostgreSQL, managed by uv."
readme = "README.md"
requires-python = ">=3.13"
license = { text = "MIT" }
authors = [
    { name = "Faiyaz Khan", email = "faiyazkhan024@gmail.com" }
]
keywords = ["python", "fastapi", "postgresql", "crud", "uv", "fullstack", "tailwind"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Topic :: Database",
    "Topic :: Internet :: WWW/HTTP :: FastCGI",
]
dependencies = [
    "email-validator>=2.2.0",
    "fastapi>=0.115.0",
    "jinja2>=3.1.4",
    "psycopg[binary,pool]>=3.2.0",
    "pydantic[email]>=2.10.0",
    "pydantic-settings>=2.6.0",
    "python-dotenv>=1.0.1",
    "python-multipart>=0.0.18",
    "uvicorn[standard]>=0.32.0",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.28.0",
    "pytest>=8.0.0",
    "ruff>=0.8.0",
]

[project.urls]
Homepage = "https://github.com/faiyazkhan024/python-postgresql-crud"
Repository = "https://github.com/faiyazkhan024/python-postgresql-crud.git"
Issues = "https://github.com/faiyazkhan024/python-postgresql-crud/issues"

[project.scripts]
python-postgresql-crud = "python_postgresql_crud.main:run"

[build-system]
requires = ["uv_build>=0.12.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 88
target-version = "py313"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "SIM", # flake8-simplify
]
ignore = []

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
python_files = ["test_*.py"]
